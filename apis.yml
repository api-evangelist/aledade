aid: aledade
name: Aledade
description: 'Aledade is a physician-led public benefit corporation and national leader
  in value-based care, partnering with independent primary care practices, community
  health centers, and health systems. It pairs data analytics, guided clinical workflows,
  integrated care solutions, and payer contracts to help primary care organizations
  succeed in accountable care organizations (ACOs) and value-based payment models,
  improving patient outcomes while supporting the business sustainability of independent
  practices. Added to the API Evangelist network as a portfolio company of gv, ivp,
  and lightspeed-venture-partners.'
